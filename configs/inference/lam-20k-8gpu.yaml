
experiment:
    type: lam
    seed: 42
    parent: lam 
    child: lam_20k

model_name: ./model_zoo/lam_models/releases/lam/lam-20k/step_045500/
# For stylization, point model_name at the trained checkpoint instead:
#   exps/train_lam/style_appearance_e2e_v8/model_final.pt
# (color-only appearance_mlp + geometry_mlp; the backbone is identical to the
# release weights, so plain unstyled reconstruction is unaffected either way.)
# v2/v4/v5/v6/v7 are known-bad -- see STYLE_GEOMETRY_PIPELINE.md.
image_input: ./assets/sample_input/status.png
export_video: true
export_mesh: false
motion_seqs_dir: ./assets/sample_motion/export/Look_In_My_Eyes/
# style_autoencoder_path previously defaulted to the abandoned Stage 1/2
# TinyStyleAutoEncoder checkpoint, which silently pre-blurred every style
# reference image before use. That whole approach was disconnected from the
# real style path (ReferenceStyleAdapter) and is no longer used -- see
# STYLE_GEOMETRY_PIPELINE.md and the appearance_mlp fix in modeling_lam.py.
style_autoencoder_path: null
style_autoencoder_base_channels: 48
style_autoencoder_latent_channels: 128

# Recommended stylization strengths (validated on this session's test cases):
# style_internal_appearance_strength: 0.75  # network color path
# style_geometry_strength: 0.75             # network + algebraic shape blend
# style_opacity_strength: 0.0
# style_strength: 0.3-0.4                   # LAB post-process; still useful as
#                                            # a contrast/mood refinement on top
#                                            # of the network's color, not a
#                                            # replacement for it anymore.
# style_track_geometry: true

model:
    # image encoder
    encoder_type: "dinov2_fusion"
    encoder_model_name: "dinov2_vitl14_reg"
    encoder_feat_dim: 1024
    encoder_freeze: false

    # points embeddings
    latent_query_points_type: "e2e_flame"
    pcl_dim: 1024

    # transformer
    transformer_type: "sd3_cond"
    transformer_heads: 16
    transformer_dim: 1024 
    transformer_layers: 10
    tf_grad_ckpt: true
    encoder_grad_ckpt: true

    # for gs renderer
    human_model_path: "./model_zoo/human_parametric_models"
    flame_subdivide_num: 1
    flame_type: "flame"
    gs_query_dim: 1024
    gs_use_rgb: True
    gs_sh: 3
    gs_mlp_network_config:
        n_neurons: 512
        n_hidden_layers: 2
        activation: silu
    gs_xyz_offset_max_step: 0.2
    gs_clip_scaling: 0.01
    scale_sphere: false
    
    expr_param_dim: 10
    shape_param_dim: 10
    add_teeth: false

    fix_opacity: false
    fix_rotation: false

    has_disc: false

    teeth_bs_flag: false
    oral_mesh_flag: false

dataset:
    subsets:
        -   name: video_head
            root_dirs: "./train_data/vfhq_vhap_nooffset/export"
            meta_path:
                train: "./train_data/vfhq_vhap_nooffset/label/valid_id_train_list.json"
                val: "./train_data/vfhq_vhap_nooffset/label/valid_id_val_list.json"
            sample_rate: 1.0
    sample_side_views: 7
    sample_aug_views: 0
    source_image_res: 512
    render_image:
        low: 512
        high: 512
        region: null
    num_train_workers: 4
    num_val_workers: 2
    pin_mem: true
    repeat_num: 1
    gaga_track_type: "vfhq"

train:
    mixed_precision: bf16  # REPLACE THIS BASED ON GPU TYPE
    find_unused_parameters: false
    loss:
        pixel_weight: 0.0
        pixel_loss_fn: "mse"
        crop_face_weight: 0.
        crop_mouth_weight: 0.
        crop_eye_weight: 0.
        masked_pixel_weight: 1.0
        perceptual_weight: 1.0
        tv_weight: -1
        mask_weight: 0:1.0:0.5:10000
        offset_reg_weight: 0.1
    optim:
        lr: 4e-4
        weight_decay: 0.05
        beta1: 0.9
        beta2: 0.95
        clip_grad_norm: 1.0
    scheduler:
        type: cosine
        warmup_real_iters: 3000
    batch_size: 4  # REPLACE THIS (PER GPU)
    accum_steps: 1  # REPLACE THIS
    epochs: 100  # REPLACE THIS
    debug_global_steps: null
    resume: ""

val:
    batch_size: 2
    global_step_period: 500
    debug_batches: 10

saver:
    auto_resume: true
    load_model: null
    checkpoint_root: ./exps/checkpoints
    checkpoint_global_steps: 500
    checkpoint_keep_level: 5

logger:
    stream_level: WARNING
    log_level: INFO
    log_root: ./exps/logs
    tracker_root: ./exps/trackers
    enable_profiler: false
    trackers:
        - tensorboard
    image_monitor:
        train_global_steps: 500
        samples_per_log: 4

compile:
    suppress_errors: true
    print_specializations: true
    disable: true
