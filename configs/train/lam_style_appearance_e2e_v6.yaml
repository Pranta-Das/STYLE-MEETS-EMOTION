training_mode: style_appearance_e2e

# v6: isolate the real bottleneck found after v4/v5 both barely moved the
# learned response despite very different loss reweighting -- a debug check
# showed pre-clip gradient norms of 20-70 on appearance_mlp's parameters,
# while the trainer was clipping to max_norm=1.0 (hardcoded, a holdover from
# when appearance styling could corrupt geometry and needed a tight leash).
# That means essentially every step was clipped down to the same ceiling
# regardless of loss weights -- which is exactly why reweighting content vs.
# style vs. identity in v4/v5 changed almost nothing.
#
# This config isolates that one fix: back to v2's original loss weights
# (clean baseline, no confounding from v4/v5's reweighting), grad_clip_norm
# raised 1.0 -> 20 (still a real safety margin, just not a hard ceiling that
# saturates on every step). Bounded to 1 epoch again to check the pre-tanh
# magnitude before committing further.

model_name: exps/train_lam/style_appearance_e2e_v2/model_final.pt
output_dir: exps/train_lam/style_appearance_e2e_v6
seed: 1234

content_refs_manifest: exps/train_lam/content_refs/tracked_content_refs.json
style_image_glob: ffhq-dataset/aahq-dataset/aligned/*.png

source_image_res: 512
bg_color: 1.0

epochs: 1
lr: 1.0e-4
weight_decay: 0.0
grad_accum_steps: 4
grad_clip_norm: 20.0
sample_interval: 20
num_workers: 2

style_content_layers: [relu3_3]
style_loss_layers: [relu1_2, relu2_2, relu3_3, relu4_3]
style_content_loss_weight: 1.0
style_style_loss_weight: 1.0e4
style_pixel_loss_weight: 0.02
style_adain_loss_weight: 1.0
style_tv_loss_weight: 1.0e-4
identity_loss_weight: 0.1

train_style_appearance_strength: 1.0
train_style_opacity_strength: 0.0

model:
  encoder_type: "dinov2_fusion"
  encoder_model_name: "dinov2_vitl14_reg"
  encoder_feat_dim: 1024
  encoder_freeze: true

  latent_query_points_type: "e2e_flame"
  pcl_dim: 1024

  transformer_type: "sd3_cond"
  transformer_heads: 16
  transformer_dim: 1024
  transformer_layers: 10
  tf_grad_ckpt: false
  encoder_grad_ckpt: false

  human_model_path: "./model_zoo/human_parametric_models"
  flame_subdivide_num: 1
  flame_type: "flame"
  gs_query_dim: 1024
  gs_use_rgb: true
  gs_sh: 3
  gs_mlp_network_config:
    n_neurons: 512
    n_hidden_layers: 2
    activation: silu
  gs_xyz_offset_max_step: 0.2
  gs_clip_scaling: 0.01
  scale_sphere: false

  expr_param_dim: 10
  shape_param_dim: 10

  add_teeth: false
  fix_opacity: false
  fix_rotation: false
  has_disc: false
  teeth_bs_flag: false
  oral_mesh_flag: false
