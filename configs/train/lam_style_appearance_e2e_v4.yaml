training_mode: style_appearance_e2e

# v4: v2's learned appearance response turned out to be far too timid to be
# visible in practice -- inspected the checkpoint directly: appearance_mlp's
# last-layer weights give an estimated pre-tanh gamma/beta magnitude of only
# ~0.04, deep in tanh's linear region, working out to roughly a 3% color
# nudge at recommended strengths (barely above the threshold of visibility).
#
# Root cause: style_style_loss_weight was deliberately kept moderate (1e4,
# down from an original 5e4 that caused instability) and identity_loss_weight
# (0.1) directly penalizes pixel drift from the original -- together giving
# little incentive to commit to a strong color change.
#
# That instability can no longer happen at all now: appearance styling is
# fully isolated to color, clamped to [0,1], and can never reach
# gs_hidden_features / xyz / scale / opacity again (see the color-only fix in
# modeling_lam.py / gs_renderer.py). So it's safe to push much harder than
# before. Bumping style_style_loss_weight 1e4 -> 4e4 and lowering
# identity_loss_weight 0.1 -> 0.03.
#
# Bounded to 1 epoch (~300 steps, ~45min) first -- check whether the learned
# weight magnitude and visible effect actually grow before committing to a
# longer run.

model_name: exps/train_lam/style_appearance_e2e_v2/model_final.pt
output_dir: exps/train_lam/style_appearance_e2e_v4
seed: 1234

content_refs_manifest: exps/train_lam/content_refs/tracked_content_refs.json
style_image_glob: ffhq-dataset/aahq-dataset/aligned/*.png

source_image_res: 512
bg_color: 1.0

epochs: 1
lr: 1.0e-4
weight_decay: 0.0
grad_accum_steps: 4
sample_interval: 20
num_workers: 2

style_content_layers: [relu3_3]
style_loss_layers: [relu1_2, relu2_2, relu3_3, relu4_3]
style_content_loss_weight: 1.0
style_style_loss_weight: 4.0e4
style_pixel_loss_weight: 0.02
style_adain_loss_weight: 1.0
style_tv_loss_weight: 1.0e-4
identity_loss_weight: 0.03

train_style_appearance_strength: 1.0
train_style_opacity_strength: 0.0

model:
  encoder_type: "dinov2_fusion"
  encoder_model_name: "dinov2_vitl14_reg"
  encoder_feat_dim: 1024
  encoder_freeze: true

  latent_query_points_type: "e2e_flame"
  pcl_dim: 1024

  transformer_type: "sd3_cond"
  transformer_heads: 16
  transformer_dim: 1024
  transformer_layers: 10
  tf_grad_ckpt: false
  encoder_grad_ckpt: false

  human_model_path: "./model_zoo/human_parametric_models"
  flame_subdivide_num: 1
  flame_type: "flame"
  gs_query_dim: 1024
  gs_use_rgb: true
  gs_sh: 3
  gs_mlp_network_config:
    n_neurons: 512
    n_hidden_layers: 2
    activation: silu
  gs_xyz_offset_max_step: 0.2
  gs_clip_scaling: 0.01
  scale_sphere: false

  expr_param_dim: 10
  shape_param_dim: 10

  add_teeth: false
  fix_opacity: false
  fix_rotation: false
  has_disc: false
  teeth_bs_flag: false
  oral_mesh_flag: false
