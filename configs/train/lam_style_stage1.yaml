training_mode: style_images

# Stage 1: Identity / Generalization (Large natural-face dataset)
epochs: 15
batch_size: 4
lr: 1.0e-4
output_dir: exps/train_lam/stage1_identity
seed: 1234
num_workers: 4
image_size: 256
style_base_channels: 48
style_latent_channels: 128
noise_std: 0.0
latent_blend_steps: 5

# Freeze configuration: freeze major LAM components, train adapter + style AE
freeze_modules: true
freeze_config:
  freeze_encoder: true
  freeze_transformer: true
  freeze_renderer: true

# Optimizer param groups
use_param_groups: true
lr_style_adapter: 5.0e-4
lr_other_modules: 1.0e-6

# Style dataset (point to folder of natural face images)
style_image_paths:
  - ./data/natural_faces/*.png
