training_mode: style_appearance_e2e

# v3: upgrade appearance styling from one global color transform per image to
# a per-query-point transform, computed via ReferenceStyleAdapter.style_cross_attn
# (each query point cross-attends the style image's spatial DINOv2 feature
# grid instead of everyone sharing one mean-pooled style vector). Lets
# different face regions (hair, skin, background) pick up different style
# cues instead of one uniform tint.
#
# Chains off the v2 checkpoint: appearance_mlp's weight *shapes* are unchanged
# by this upgrade (nn.Linear/LayerNorm apply per-point regardless of whether
# fed one averaged vector or one per point), so it loads and warm-starts from
# v2 training; only style_cross_attn is new and starts fresh. Both
# appearance_mlp and style_cross_attn are trained here; geometry_mlp stays
# frozen (already trained, untouched by this change).

model_name: exps/train_lam/style_appearance_e2e_v2/model_final.pt
output_dir: exps/train_lam/style_appearance_e2e_v3
seed: 1234

content_refs_manifest: exps/train_lam/content_refs/tracked_content_refs.json
style_image_glob: ffhq-dataset/aahq-dataset/aligned/*.png

source_image_res: 512
bg_color: 1.0

epochs: 3
lr: 1.0e-4
weight_decay: 0.0
grad_accum_steps: 4
sample_interval: 20
num_workers: 2

style_content_layers: [relu3_3]
style_loss_layers: [relu1_2, relu2_2, relu3_3, relu4_3]
style_content_loss_weight: 1.0
style_style_loss_weight: 1.0e4
style_pixel_loss_weight: 0.02
style_adain_loss_weight: 1.0
style_tv_loss_weight: 1.0e-4
identity_loss_weight: 0.1

train_style_appearance_strength: 1.0
train_style_opacity_strength: 0.0

model:
  encoder_type: "dinov2_fusion"
  encoder_model_name: "dinov2_vitl14_reg"
  encoder_feat_dim: 1024
  encoder_freeze: true

  latent_query_points_type: "e2e_flame"
  pcl_dim: 1024

  transformer_type: "sd3_cond"
  transformer_heads: 16
  transformer_dim: 1024
  transformer_layers: 10
  tf_grad_ckpt: false
  encoder_grad_ckpt: false

  human_model_path: "./model_zoo/human_parametric_models"
  flame_subdivide_num: 1
  flame_type: "flame"
  gs_query_dim: 1024
  gs_use_rgb: true
  gs_sh: 3
  gs_mlp_network_config:
    n_neurons: 512
    n_hidden_layers: 2
    activation: silu
  gs_xyz_offset_max_step: 0.2
  gs_clip_scaling: 0.01
  scale_sphere: false

  expr_param_dim: 10
  shape_param_dim: 10
  style_adapter_attn_heads: 4

  add_teeth: false
  fix_opacity: false
  fix_rotation: false
  has_disc: false
  teeth_bs_flag: false
  oral_mesh_flag: false
