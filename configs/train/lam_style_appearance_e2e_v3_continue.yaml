training_mode: style_appearance_e2e

# v3-continue: warm-start from the v3 checkpoint (style_cross_attn + appearance_mlp
# already trained 900 steps) and keep training rather than restarting from
# scratch. Rationale: v3's per-point color transform came out sharp but weaker
# and no more spatially differentiated than v2's simple global tint (measured:
# hair-vs-skin color gap not meaningfully larger, overall saturation lower).
# That's the expected signature of undertraining a harder-to-fit head (learned
# per-point attention routing) on the same step budget that sufficed for v2's
# much simpler global head -- not evidence the approach is broken.
#
# style_style_loss_weight bumped 1e4 -> 1.5e4: a per-point head has more
# capacity to let different points cancel each other out (some warm, some
# cool -> net washed-out, matching what was measured) than a single global
# vector does; a slightly stronger pull gives it more reason to commit to a
# coherent, stronger direction per point instead of hedging.
#
# Bounded to 2 epochs (~600 steps, ~1.5hr) as a checkpoint on whether the
# trend (color strength, hair/skin differentiation) is actually improving,
# rather than committing blindly to a longer run.

model_name: exps/train_lam/style_appearance_e2e_v3/model_final.pt
output_dir: exps/train_lam/style_appearance_e2e_v3_continue
seed: 1234

content_refs_manifest: exps/train_lam/content_refs/tracked_content_refs.json
style_image_glob: ffhq-dataset/aahq-dataset/aligned/*.png

source_image_res: 512
bg_color: 1.0

epochs: 2
lr: 1.0e-4
weight_decay: 0.0
grad_accum_steps: 4
sample_interval: 20
num_workers: 2

style_content_layers: [relu3_3]
style_loss_layers: [relu1_2, relu2_2, relu3_3, relu4_3]
style_content_loss_weight: 1.0
style_style_loss_weight: 1.5e4
style_pixel_loss_weight: 0.02
style_adain_loss_weight: 1.0
style_tv_loss_weight: 1.0e-4
identity_loss_weight: 0.1

train_style_appearance_strength: 1.0
train_style_opacity_strength: 0.0

model:
  encoder_type: "dinov2_fusion"
  encoder_model_name: "dinov2_vitl14_reg"
  encoder_feat_dim: 1024
  encoder_freeze: true

  latent_query_points_type: "e2e_flame"
  pcl_dim: 1024

  transformer_type: "sd3_cond"
  transformer_heads: 16
  transformer_dim: 1024
  transformer_layers: 10
  tf_grad_ckpt: false
  encoder_grad_ckpt: false

  human_model_path: "./model_zoo/human_parametric_models"
  flame_subdivide_num: 1
  flame_type: "flame"
  gs_query_dim: 1024
  gs_use_rgb: true
  gs_sh: 3
  gs_mlp_network_config:
    n_neurons: 512
    n_hidden_layers: 2
    activation: silu
  gs_xyz_offset_max_step: 0.2
  gs_clip_scaling: 0.01
  scale_sphere: false

  expr_param_dim: 10
  shape_param_dim: 10
  style_adapter_attn_heads: 4

  add_teeth: false
  fix_opacity: false
  fix_rotation: false
  has_disc: false
  teeth_bs_flag: false
  oral_mesh_flag: false
